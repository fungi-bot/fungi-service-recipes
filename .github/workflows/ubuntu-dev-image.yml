name: Build Ubuntu development SSH image

on:
  pull_request:
    paths:
      - "images/ubuntu-dev-ssh/**"
      - ".github/workflows/ubuntu-dev-image.yml"
  push:
    branches:
      - main
    paths:
      - "images/ubuntu-dev-ssh/**"
      - ".github/workflows/ubuntu-dev-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build multi-architecture image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: images/ubuntu-dev-ssh
          load: true
          platforms: linux/amd64
          tags: fungi-ubuntu-dev:smoke
          cache-from: type=gha

      - name: Smoke-test SSH image
        shell: bash
        run: |
          set -euo pipefail

          data_dir="$(mktemp -d)"
          workspace_dir="$(mktemp -d)"
          container_name="fungi-ubuntu-dev-smoke"

          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          chmod 0777 "${workspace_dir}"
          printf '%s\n' smoke > "${workspace_dir}/host-file"

          start_container() {
            docker run -d \
              --name "${container_name}" \
              -e SSH_PASSWORD=smoke-password \
              -v "${data_dir}:/data" \
              -v "${workspace_dir}:/workspace" \
              fungi-ubuntu-dev:smoke >/dev/null

            for _ in $(seq 1 30); do
              if docker exec "${container_name}" \
                ssh-keyscan -T 1 -p 2222 127.0.0.1 >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done

            docker logs "${container_name}"
            return 1
          }

          start_container
          docker exec "${container_name}" passwd -S dev | grep -q '^dev P '
          docker exec --user dev "${container_name}" test -r /workspace/host-file
          docker exec --user dev "${container_name}" touch /workspace/container-file
          docker exec --user dev "${container_name}" \
            sh -c "printf '%s\n' 'ssh-ed25519 smoke-test-key' >> /data/home/dev/.ssh/authorized_keys"

          host_key_before="$(docker exec "${container_name}" \
            sha256sum /data/ssh/ssh_host_ed25519_key)"

          docker rm -f "${container_name}" >/dev/null
          start_container

          host_key_after="$(docker exec "${container_name}" \
            sha256sum /data/ssh/ssh_host_ed25519_key)"
          test "${host_key_before}" = "${host_key_after}"
          docker exec "${container_name}" \
            grep -q 'ssh-ed25519 smoke-test-key' /data/home/dev/.ssh/authorized_keys
          test -f "${workspace_dir}/container-file"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: images/ubuntu-dev-ssh
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fungi-ubuntu-dev:24.04-0.1.0
            ghcr.io/${{ github.repository_owner }}/fungi-ubuntu-dev:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
