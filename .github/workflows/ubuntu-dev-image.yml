name: Build Ubuntu development SSH image

on:
  pull_request:
    paths:
      - "images/ubuntu-dev-ssh/**"
      - ".github/workflows/ubuntu-dev-image.yml"
  push:
    branches:
      - main
    paths:
      - "images/ubuntu-dev-ssh/**"
      - ".github/workflows/ubuntu-dev-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build multi-architecture image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: images/ubuntu-dev-ssh
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/fungi-ubuntu-dev:24.04-0.1.0
            ghcr.io/${{ github.repository_owner }}/fungi-ubuntu-dev:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
